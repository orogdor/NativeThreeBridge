<!DOCTYPE html>
<html><head><title>Native DX12 Texture2D checker</title></head><body>
<canvas id="gl" data-native-webgl2-prototype width="640" height="480"></canvas>
<script>
const cv=document.querySelector('#gl'),gl=cv.getContext('webgl2');
function shader(type,source) {
 const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
 return s;
}
const vs=shader(gl.VERTEX_SHADER,`#version 300 es
layout(location=0) in vec3 aPosition;
layout(location=1) in vec2 aUV;
out vec2 vUV;
void main(){vUV=aUV;gl_Position=vec4(aPosition,1.0);}`);
const fs=shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
out vec4 outColor;
void main(){outColor=texture(uTex,vUV);}`);
const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
gl.useProgram(p);
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
function attrib(slot,size,arr){
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(slot);gl.vertexAttribPointer(slot,size,gl.FLOAT,false,0,0);
}
attrib(0,3,new Float32Array([-0.8,-0.8,0, 0.8,-0.8,0, 0.8,0.8,0, -0.8,0.8,0]));
attrib(1,2,new Float32Array([0,1, 1,1, 1,0, 0,0]));
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
const texture=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([
255,0,0,255, 0,255,0,255,
0,0,255,255, 255,230,0,255
]));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.uniform1i(gl.getUniformLocation(p,'uTex'),0);
const stack=gl.createTexture();gl.activeTexture(gl.TEXTURE0+6);gl.bindTexture(gl.TEXTURE_2D_ARRAY,stack);
gl.texImage3D(gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,1,1,2,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([20,20,20,255,200,200,200,255]));
gl.texSubImage3D(gl.TEXTURE_2D_ARRAY,0,0,0,1,1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([128,80,60,255]));
gl.activeTexture(gl.TEXTURE0);
window.textureStatus={nativeUploadCount:gl.__nativeTextureUploads,stackDepth:stack.depth,stackSecondPixel:Array.from(stack.pixels.slice(4,8))};
const strip=new Image();
strip.onload=()=>{
 const a=gl.createTexture();gl.activeTexture(gl.TEXTURE0+7);gl.bindTexture(gl.TEXTURE_2D_ARRAY,a);
 gl.texImage3D(gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,2,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,strip);
 window.textureStatus.encodedAtlasUploaded=!!a.nativeUploaded;
 window.textureStatus.encodedAtlasStoredAs2D=!!a.atlasOnly;
 window.textureStatus.encodedAtlasDepth=a.depth;
 gl.activeTexture(gl.TEXTURE0);
};
strip.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAAECAYAAACk7+45AAAAG0lEQVR4nGP8z8Dwn4GBgYGJAQoYGSr+o4oAAGfCBHvzu4cxAAAAAElFTkSuQmCC';
function frame(){
 gl.viewport(0,0,cv.width,cv.height);
 gl.clearColor(0.025,0.035,0.05,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);
 window.textureStatus.drawCount=gl.__nativeDraws;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
