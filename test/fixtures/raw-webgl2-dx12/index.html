<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DX12 raw GL triangle</title></head>
<body style="margin:0">
<canvas id="raw" data-native-webgl2-prototype width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('raw');
const gl = canvas.getContext('webgl2');
if (!gl) throw Error('Raw WebGL2 opt-in DX12 context unavailable');
if (gl.getContextAttributes().stencil !== false) throw Error('Context flags not configured');
function stage(type, code) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, code);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(shader));
  return shader;
}
const vs = stage(gl.VERTEX_SHADER, '#version 300 es\nlayout(location=0) in vec3 aPosition;\nvoid main(){gl_Position=vec4(aPosition,1.0);}');
const fs = stage(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;\nout vec4 outColor;\nvoid main(){outColor=vec4(1.0,0.15,0.07,1.0);}');
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const vertices = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8,-0.8,0, 0.8,-0.8,0, 0,0.8,0]), gl.STATIC_DRAW);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.clearColor(0.04, 0.06, 0.11, 1);
window.rawPrototypeReady = true;
window.rawPrototypeDraws = 0;
function frame() {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  window.rawPrototypeDraws = gl.__nativeDraws;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
