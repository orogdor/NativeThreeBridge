<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Textures</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #world { position: fixed; inset: 0; width: 100%; height: 100%; }
    #mini { position: fixed; left: 10px; top: 10px; width: 100px; height: 100px; }
    #hint { position: fixed; right: 10px; top: 10px; padding: 4px; background: #244c38; color: #fff; }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="mini" width="50" height="50"></canvas>
  <div id="hint" hidden>Hint</div>
  <script type="module" src="main.js"></script>
</body>
</html>
