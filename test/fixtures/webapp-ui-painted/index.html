<!doctype html><html><head><meta charset="utf-8"><title>Painted HUD test</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; --u: calc(min(100vw / 1280, 100vh / 720) * var(--scale, 1)); }
.fields { display: grid; grid-template-columns: 1fr 1fr; }
#panel { position: absolute; left: 10px; top: 10px; width: 200px; height: 100px; border: 12px solid transparent;
  border-image: url('frame.png') 25% fill / 16px / 0 stretch; background: #102235; }
#title { position: absolute; left: 300px; top: 10px; font: 700 calc(28 * var(--u))/1 Georgia, serif; }
.res { position: absolute; top: 60px; width: 40px; height: 20px; }
.res[data-kind=gold] { left: 300px; }
.res[data-kind=wood] { left: 400px; }
#medal { position: absolute; left: 600px; top: 10px; width: 100px; height: 100px; z-index: 4; }
#medal > .frame { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; }
#medal > button { position: absolute; inset: 0; z-index: auto; }
#medal > button > img { position: absolute; left: 10px; top: 10px; width: 80px; height: 80px; z-index: 2; clip-path: inset(0 0 25% 0); border-radius: 50%; }
</style></head>
<body>
<details id="closed"><summary id="sum">More</summary><div class="fields" id="fields"><label>A</label><label>B</label></div>Loose text</details>
<details id="opened" open><summary>Open</summary><div class="fields" id="fields2"><label>C</label></div></details>
<div id="panel"></div>
<div id="title">World map</div>
<button class="res" id="r1"></button><button class="res" id="r2"></button>
<section id="medal"><img class="frame" src="frame.png" alt=""><button id="main"><img id="pic" src="frame.png" alt=""></button></section>
<script>
const r1 = document.getElementById('r1'), r2 = document.getElementById('r2');
r1.dataset.kind = 'gold'; r2.dataset.kind = 'wood';
r2.dataset.extraValue = 'x';
</script>
</body></html>
