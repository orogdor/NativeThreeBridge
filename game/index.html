<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NativeThreeBridge — 10 000 puud, 1000 sõdurit</title>
  <!-- NativeThreeBridge v0.26.0 reads this ONE manifest field, then executes
       the original unchanged scene.js in the original QuickJS engine.
       The DX12 renderer, shaders and simulation do not parse the DOM. -->
  <meta name="native-three-entry" content="scene.js">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030611;color:#e9edf5;font:14px system-ui,sans-serif}
    #screen{width:100%;height:100%;display:block}
    #info{position:fixed;top:12px;left:12px;padding:10px 14px;background:rgba(6,14,27,.85);border:1px solid #4b5b72;border-radius:8px;pointer-events:none}
    #status{display:block;margin-top:6px;color:#9abbce}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js"}}
  </script>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="info">
    <strong>10 000 puud · 1000 sõdurit · sama scene.js</strong>
    <span id="status">Laadimine…</span>
    <small>Hiir: pööra · Ratas: suumi · Tühik: paus · F12: kiire lahing</small>
  </div>
  <!-- Browser preview entry; native DX12 bypasses ONLY this browser viewer.
       It loads scene.js from the meta tag above, unchanged. -->
  <script type="module" src="./browser.js"></script>
</body>
</html>
