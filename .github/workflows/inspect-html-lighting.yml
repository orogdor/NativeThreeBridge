name: Inspect HTML lighting (temporary)
on:
  push:
    paths:
      - ".github/workflows/inspect-html-lighting.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("benchmarks/NativeThreeBridge-v016-WebGL2-RENDER-FIX.html").read_text()
          lines=s.splitlines()
          needles=('SpotLight','PointLight','DirectionalLight','AmbientLight','shadowMap','shadowCount','castShadow','receiveShadow','Light(', 'light.position','light.target','setPixelRatio')
          hits=[i for i in range(86175,min(86242,len(lines)))]
          print('HTML lines',len(lines),'light matches',len(hits))
          for i in hits:
              print(f'### line {i+1}\n'+'\n'.join(f'{j+1}: {lines[j][:400]}' for j in range(max(0,i-3),min(len(lines),i+4))))
          PY
