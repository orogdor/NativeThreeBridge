name: Native Three.js runtime smoke and DX12 build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-threejs-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build official Three.js module without DOM or browser
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm dependencies failed" }
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
          if ($LASTEXITCODE -ne 0) { throw "esbuild dependency failed" }
          New-Item -ItemType Directory -Force generated,third_party | Out-Null
          npx esbuild threejs-native/scene.mjs --bundle --platform=neutral --format=iife --target=es2020 --outfile=generated/three-scene.bundle.js
          if ($LASTEXITCODE -ne 0) { throw "Three.js bundle build failed" }
          node --test test/native-scene.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Real Three.js structure tests failed" }
      - name: Convert pinned Kuningriigid GLBs into native resources
        shell: pwsh
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed" }
          python tools/pack_kuningriigid.py
          if ($LASTEXITCODE -ne 0) { throw "GLB packer failed" }
      - name: Download pinned QuickJS-NG C runtime
        shell: pwsh
        run: |
          git clone --branch v0.13.0 --depth 1 https://github.com/quickjs-ng/quickjs.git third_party/quickjs
          if ($LASTEXITCODE -ne 0) { throw "QuickJS-NG checkout failed" }
      - name: Compile native Three.js runtime and DX12 renderer with MSVC
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build --config Release --target ThreeSceneSmoke NativeThreeJS --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "CMake/MSVC build failed" }
      - name: Execute actual JS interpreter smoke test inside Windows
        shell: pwsh
        env:
          CI: '1'
        run: |
          & .\build\Release\ThreeSceneSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Real Three.js embedded smoke test failed" }
      - name: Save prototype EXE for review
        uses: actions/upload-artifact@v4
        with:
          name: NativeThreeJS-DX12-prototype
          path: build/Release/NativeThree-Diagnostics.exe

      - name: Package EXE with self-updating launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/NativeThree-Diagnostics.exe dist/NativeThree-Diagnostics.exe
          Copy-Item build/Release/NativeThree-Diagnostics.exe dist/NativeThree-DX12.exe
          cl /nologo /O2 /W3 /TC launcher/NativeThree-Launcher.c /Fe:dist/NativeThree-Launcher.exe /link /SUBSYSTEM:WINDOWS kernel32.lib shell32.lib user32.lib winhttp.lib advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw "Native updater compile failed" }
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          Set-Content dist/installed-version.txt -Value $v -Encoding ascii -NoNewline
          $hash = (Get-FileHash dist/NativeThree-Diagnostics.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) "dist/update.txt"), ($v + [Environment]::NewLine + $hash + [Environment]::NewLine), [Text.Encoding]::ASCII)
          Copy-Item README-WINDOWS.txt dist/README-WINDOWS.txt
          Copy-Item third_party/quickjs/LICENSE dist/LICENSE-QuickJS.txt
          Copy-Item node_modules/three/LICENSE dist/LICENSE-ThreeJS.txt
          Compress-Archive -Path dist/NativeThree-Launcher.exe,dist/NativeThree-Diagnostics.exe,dist/NativeThree-DX12.exe,dist/installed-version.txt,dist/README-WINDOWS.txt,dist/LICENSE-QuickJS.txt,dist/LICENSE-ThreeJS.txt -DestinationPath dist/NativeThreeBridge-Windows-x64.zip -Force
          if ((Get-Item dist/NativeThree-Diagnostics.exe).Length -lt 150000) { throw "Three.js DX12 EXE unexpectedly small" }
          Write-Host "DX12 + embedded real Three.js: $v; sha256: $hash"
      - name: Upload self-contained Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NativeThreeBridge-Windows-x64
          path: |
            dist/NativeThreeBridge-Windows-x64.zip
            dist/update.txt
      - name: Release verified native Three.js runtime
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: $${{ github.token }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $tag = "v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. No file mutation."
          } else {
            gh release create $tag dist/NativeThreeBridge-Windows-x64.zip dist/NativeThree-Diagnostics.exe dist/NativeThree-DX12.exe dist/update.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "NativeThreeBridge $tag - real Three.js runtime" --notes "QuickJS-NG runs the OFFICIAL Three.js Scene, Group, Mesh, InstancedMesh and world matrix calculations inside a browser-free Windows EXE. Native DirectX12 renderer consumes real Three.js instance matrices. Kuningriigid house and pine GLBs embedded at build time (10 + 10). Windows JavaScript-runtime smoke test passed; physical GPU/window rendering still needs user validation. NOT general WebGLRenderer or GLTFLoader compatibility."
            if ($LASTEXITCODE -ne 0) { throw "GitHub release failed" }
          }
