name: Build separate Kuningriigid compatibility package
on:
  push:
    branches: [experiment/kuningriigid-game]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build official Three.js core separately from game/scene.js
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
          if ($LASTEXITCODE -ne 0) { throw "esbuild install failed" }
          New-Item -ItemType Directory -Force generated,third_party | Out-Null
          npx esbuild threejs-native/three-runtime-entry.mjs --bundle --platform=neutral --format=iife --target=es2020 --outfile=generated/three-runtime.bundle.js
          if ($LASTEXITCODE -ne 0) { throw "Three.js runtime bundle failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "JavaScript tests failed" }
      - name: Convert original Kuningriigid spearman and pine GLBs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed" }
          python tools/test_spearman_rig.py
          if ($LASTEXITCODE -ne 0) { throw "Eight-bone GLB skin unit tests failed" }
          python tools/pack_kuningriigid.py
          if ($LASTEXITCODE -ne 0) { throw "GLB conversion failed" }
          if (!(Test-Path generated/soldier-rigged.glb) -or !(Test-Path generated/skin0.bin)) { throw "Skeleton asset packing failed" }
      - name: Generate editable native PCM16 audio test samples
        shell: pwsh
        run: |
          python tools/generate_native_audio_samples.py
          if ($LASTEXITCODE -ne 0) { throw "Native audio WAV generation failed" }
          foreach ($name in @('signal','step','restart','swing','hit','death')) {
            if (!(Test-Path "game/audio/$name.wav")) { throw "Missing $name WAV" }
          }
      - name: Acquire pinned QuickJS-NG native JavaScript engine
        shell: pwsh
        run: |
          git clone --branch v0.13.0 --depth 1 https://github.com/quickjs-ng/quickjs.git third_party/quickjs
          if ($LASTEXITCODE -ne 0) { throw "QuickJS-NG checkout failed" }
      - name: Compile native game engine and runtime smoke test
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build --config Release --target NativeCoreSmoke ThreeSceneSmoke NativeThreeJS --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native game EXE failed to compile" }
      - name: Verify generic scene registry, spatial index and async path worker pool
        shell: pwsh
        run: |
          & .\\build\\Release\\NativeCoreSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Native core subsystem tests failed" }
      - name: Compile HLSL main lighting and per-soldier shadow shaders without GPU
        shell: pwsh
        run: |
          cl /nologo /O2 /W3 /EHsc /std:c++17 tools/shader_smoke.cpp /Fe:build/shader_smoke.exe /link d3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw "Shader compiler smoke executable failed to build" }
          & .\build\shader_smoke.exe native-dx12/NativeThree-DX12.cpp
          if ($LASTEXITCODE -ne 0) { throw "DX12 lighting/shadow HLSL failed to compile" }
      - name: Execute actual Three.js runtime smoke test in Windows
        shell: pwsh
        env:
          CI: '1'
        run: |
          if (!(Test-Path build/Release/game/scene.js)) { throw "External scene.js missing" }
          & .\build\Release\ThreeSceneSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Embedded Three.js JavaScript execution failed" }
      - name: Build three separate Windows executables and package Kuningriigid source mode
        shell: pwsh
        env:
          CI: '1'
        run: |
          New-Item -ItemType Directory -Force dist/game | Out-Null
          $stable=Invoke-RestMethod 'https://api.github.com/repos/orogdor/NativeThreeBridge/releases/latest'
          if ($stable.prerelease -or $stable.tag_name -notmatch '^v\d+\.\d+\.\d+$') { throw "No stable forest-battle engine release" }
          $engineAsset=$stable.assets | Where-Object name -eq 'NativeThree-Game.exe' | Select-Object -First 1
          $manifestAsset=$stable.assets | Where-Object name -eq 'engine-update-v1.json' | Select-Object -First 1
          if (!$engineAsset -or !$manifestAsset) { throw "Stable release lacks engine EXE or checksum manifest" }
          $engineManifest=Invoke-RestMethod $manifestAsset.browser_download_url
          if ($engineManifest.tag -ne $stable.tag_name) { throw "Engine manifest tag mismatch" }
          Invoke-WebRequest $engineAsset.browser_download_url -OutFile dist/NativeThree-Game.exe
          $engineHash=(Get-FileHash dist/NativeThree-Game.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($engineHash -ne $engineManifest.sha256 -or (Get-Item dist/NativeThree-Game.exe).Length -ne $engineManifest.size) { throw "Stable engine checksum mismatch" }
          Copy-Item game/SOURCE.txt dist/game/SOURCE.txt
          dotnet publish launcher/GameUpdater.csproj -c Release -r win-x64 --self-contained true -o dist/game-updater-build
          if ($LASTEXITCODE -ne 0) { throw "Game updater failed to publish" }
          dotnet publish launcher/EngineUpdater.csproj -c Release -r win-x64 --self-contained true -o dist/engine-updater-build
          if ($LASTEXITCODE -ne 0) { throw "Engine updater failed to publish" }
          Move-Item dist/game-updater-build/Game-Updater.exe dist/Game-Updater.exe
          Move-Item dist/engine-updater-build/Engine-Updater.exe dist/Engine-Updater.exe
          Remove-Item dist/game-updater-build,dist/engine-updater-build -Recurse -Force
          $gameTest=Start-Process -FilePath (Resolve-Path dist/Game-Updater.exe) -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($gameTest.ExitCode -ne 0) { throw "Game updater self-test failed" }
          $engineTest=Start-Process -FilePath (Resolve-Path dist/Engine-Updater.exe) -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($engineTest.ExitCode -ne 0) { throw "Engine updater self-test failed" }
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+-kuningriigid\.\d+$') { throw "Invalid Kuningriigid test version" }
          Set-Content dist/engine-version.txt -Value $stable.tag_name -Encoding ascii -NoNewline
          Copy-Item README-WINDOWS.txt dist/README-WINDOWS.txt
          Copy-Item third_party/quickjs/LICENSE dist/LICENSE-QuickJS.txt
          Copy-Item node_modules/three/LICENSE dist/LICENSE-ThreeJS.txt
          Compress-Archive -Path dist/* -DestinationPath NativeThreeBridge-Windows-x64.zip -Force
          Move-Item NativeThreeBridge-Windows-x64.zip dist/NativeThreeBridge-Windows-x64.zip -Force
          New-Item -ItemType Directory -Force verify | Out-Null
          Expand-Archive dist/NativeThreeBridge-Windows-x64.zip -DestinationPath verify -Force
          $executables=@(Get-ChildItem verify -Recurse -Filter *.exe)
          if ($executables.Count -ne 3) { throw "ZIP must contain exactly three EXEs, found $($executables.Count)" }
          foreach ($name in @('Game-Updater.exe','Engine-Updater.exe','NativeThree-Game.exe')) {
            if (!(Test-Path "verify/$name")) { throw "Missing $name" }
          }
          if (Test-Path verify/game/scene.js) { throw "Forest battle must not be the new default" }
          $probe=Start-Process -FilePath (Resolve-Path verify/NativeThree-Game.exe) -Wait -PassThru -WindowStyle Hidden -WorkingDirectory (Resolve-Path verify)
          if ($probe.ExitCode -ne 42) { throw "Native game did not refuse unsupported browser game with code 42" }
          if (!(Select-String -Path verify/compatibility-report.txt -Pattern 'No compatible game/scene.js found' -Quiet)) { throw "Missing compatibility report" }
          Set-Content verify/game/.native-three-game-manifest.json '{"test":true}'
          $importProbe=Start-Process -FilePath (Resolve-Path verify/NativeThree-Game.exe) -Wait -PassThru -WindowStyle Hidden -WorkingDirectory (Resolve-Path verify)
          if ($importProbe.ExitCode -ne 42) { throw "Imported browser game was not refused" }
          if (!(Select-String -Path verify/compatibility-report.txt -Pattern 'No downloaded game code was executed' -Quiet)) { throw "Imported game compatibility report missing" }
          Write-Host "Three EXEs and safe compatibility response verified: $v"
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: NativeThreeBridge-Windows-x64
          path: |
            dist/NativeThreeBridge-Windows-x64.zip
      - name: Publish marked test release after Windows tests succeed
        if: github.ref == 'refs/heads/experiment/kuningriigid-game'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $tag="v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; it is NOT overwritten"
          } else {
            gh release create $tag dist/NativeThreeBridge-Windows-x64.zip dist/NativeThree-Game.exe dist/Game-Updater.exe dist/Engine-Updater.exe --prerelease --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Kuningriigid compatibility experiment $tag" --notes "Separate Kuningriigid test branch. The ZIP contains three EXEs: game updater, stable shared engine updater and manual game launcher. Both updaters show download percentages. The package uses the latest stable forest-battle engine EXE without changing the main battle scenario. Kuningriigid currently fails its browser/Three.js compatibility check before downloaded game code runs."
            if ($LASTEXITCODE -ne 0) { throw "GitHub release failed" }
          }
