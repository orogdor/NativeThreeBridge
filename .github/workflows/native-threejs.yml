name: Build native Three.js Windows Game and separate Updater
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build official Three.js core separately from game/scene.js
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
          if ($LASTEXITCODE -ne 0) { throw "esbuild install failed" }
          New-Item -ItemType Directory -Force generated,third_party | Out-Null
          npx esbuild threejs-native/three-runtime-entry.mjs --bundle --platform=neutral --format=iife --target=es2020 --outfile=generated/three-runtime.bundle.js
          if ($LASTEXITCODE -ne 0) { throw "Three.js runtime bundle failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "JavaScript tests failed" }
      - name: Convert original Kuningriigid spearman and pine GLBs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed" }
          python tools/test_spearman_rig.py
          if ($LASTEXITCODE -ne 0) { throw "Eight-bone GLB skin unit tests failed" }
          python tools/pack_kuningriigid.py
          if ($LASTEXITCODE -ne 0) { throw "GLB conversion failed" }
          if (!(Test-Path generated/soldier-rigged.glb) -or !(Test-Path generated/skin0.bin)) { throw "Skeleton asset packing failed" }
      - name: Generate editable native PCM16 audio test samples
        shell: pwsh
        run: |
          python tools/generate_native_audio_samples.py
          if ($LASTEXITCODE -ne 0) { throw "Native audio WAV generation failed" }
          foreach ($name in @('signal','step','restart','swing','hit','death')) {
            if (!(Test-Path "game/audio/$name.wav")) { throw "Missing $name WAV" }
          }
      - name: Acquire pinned QuickJS-NG native JavaScript engine
        shell: pwsh
        run: |
          git clone --branch v0.13.0 --depth 1 https://github.com/quickjs-ng/quickjs.git third_party/quickjs
          if ($LASTEXITCODE -ne 0) { throw "QuickJS-NG checkout failed" }
      - name: Acquire prebuilt V8 13.0 for webapp JavaScript (pmed/v8-nuget)
        shell: pwsh
        run: |
          nuget install v8-v143-x64 -Version 13.0.245.25 -OutputDirectory third_party/v8pkg -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "V8 NuGet download failed" }
          Get-ChildItem third_party/v8pkg/v8.redist-v143-x64.13.0.245.25/lib/Release | Format-Table Name, Length
      - name: Compile native game engine and runtime smoke test
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DNTB_WEBAPP_V8=ON -DV8_PACKAGE_DIR="$PWD/third_party/v8pkg/v8-v143-x64.13.0.245.25" -DV8_REDIST_DIR="$PWD/third_party/v8pkg/v8.redist-v143-x64.13.0.245.25"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build --config Release --target NativeCoreSmoke ThreeSceneSmoke WebappSmoke WebappSmokeV8 NativeThreeJS --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native game EXE failed to compile" }
      - name: Verify generic scene registry, spatial index and async path worker pool
        shell: pwsh
        run: |
          & .\\build\\Release\\NativeCoreSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Native core subsystem tests failed" }
      - name: Verify independent UI/3D cadence clock (native C++)
        shell: pwsh
        run: |
          cl /nologo /EHsc /std:c++17 test/ui-cadence-smoke.cpp /Fe:build/ui-cadence-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "UI cadence smoke compile failed" }
          & .\\build\\ui-cadence-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "UI cadence smoke test failed" }
      - name: Compile HLSL main lighting and per-soldier shadow shaders without GPU
        shell: pwsh
        run: |
          cl /nologo /O2 /W3 /EHsc /std:c++17 tools/shader_smoke.cpp /Fe:build/shader_smoke.exe /link d3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw "Shader compiler smoke executable failed to build" }
          & .\build\shader_smoke.exe native-dx12/NativeThree-DX12.cpp
          if ($LASTEXITCODE -ne 0) { throw "DX12 lighting/shadow HLSL failed to compile" }
      - name: Execute actual Three.js runtime smoke test in Windows
        shell: pwsh
        env:
          CI: '1'
        run: |
          if (!(Test-Path build/Release/game/scene.js)) { throw "External scene.js missing" }
          & .\build\Release\ThreeSceneSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Embedded Three.js JavaScript execution failed" }
      - name: Run Three.js webapp folders through the embedded webapp runtime (headless)
        shell: pwsh
        env:
          CI: '1'
        run: |
          & .\build\Release\WebappSmoke.exe samples/hello-webapp 6 expect-resize
          if ($LASTEXITCODE -ne 0) { throw "hello-webapp failed in the native webapp runtime" }
          & .\build\Release\WebappSmoke.exe test/fixtures/webapp-edge 3
          if ($LASTEXITCODE -ne 0) { throw "edge-case webapp failed in the native webapp runtime" }
          & .\build\Release\WebappSmoke.exe test/fixtures/webapp-bad-import 0 expect-boot-error
          if ($LASTEXITCODE -ne 0) { throw "broken import was not reported correctly" }
          # Same folders on the V8 backend the game EXE now uses.
          & .\build\Release\WebappSmokeV8.exe samples/hello-webapp 6 expect-resize
          if ($LASTEXITCODE -ne 0) { throw "hello-webapp failed on V8" }
          & .\build\Release\WebappSmokeV8.exe test/fixtures/webapp-edge 3
          if ($LASTEXITCODE -ne 0) { throw "edge-case webapp failed on V8" }
          & .\build\Release\WebappSmokeV8.exe test/fixtures/webapp-bad-import 0 expect-boot-error
          if ($LASTEXITCODE -ne 0) { throw "broken import was not reported correctly on V8" }
          # A dynamic loader should work identically on QuickJS and V8.
          & .\build\Release\WebappSmoke.exe test/fixtures/webapp-dynamic-scripts 0 expect-dynamic-scripts
          if ($LASTEXITCODE -ne 0) { throw "dynamic scripts failed on QuickJS" }
          & .\build\Release\WebappSmokeV8.exe test/fixtures/webapp-dynamic-scripts 0 expect-dynamic-scripts
          if ($LASTEXITCODE -ne 0) { throw "dynamic scripts failed on V8" }
          # First real raw-WebGL2 -> the same DX12 packet sink as Three.js.
          # Opt-in only; exercise both JS engines with 300 live frames and
          # require nonzero geometry uploads and draws, not an empty window.
          & .\build\Release\WebappSmoke.exe test/fixtures/raw-webgl2-dx12 1
          if ($LASTEXITCODE -ne 0) { throw "raw WebGL2->DX12 bridge fixture failed on QuickJS" }
          & .\build\Release\WebappSmokeV8.exe test/fixtures/raw-webgl2-dx12 1
          if ($LASTEXITCODE -ne 0) { throw "raw WebGL2->DX12 bridge fixture failed on V8" }
          # HTML/CSS UI layer: stylesheets, layout, display list over the 3D scene.
          & .\build\Release\WebappSmoke.exe test/fixtures/webapp-ui 1 expect-ui
          if ($LASTEXITCODE -ne 0) { throw "HTML/CSS UI fixture failed in the native webapp runtime" }
          & .\build\Release\WebappSmokeV8.exe test/fixtures/webapp-ui 1 expect-ui
          if ($LASTEXITCODE -ne 0) { throw "HTML/CSS UI fixture failed on V8" }
      - name: Verify native web storage survives a Windows restart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/storage-smoke | Out-Null
          @'
          <!doctype html><title>Storage pending</title><script type="module">
          import * as THREE from 'three';
          const renderer = new THREE.WebGLRenderer();
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
          camera.position.z = 5;
          scene.add(new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial()));
          renderer.setAnimationLoop(() => renderer.render(scene, camera));
          const open = indexedDB.open('smoke', 1);
          open.onupgradeneeded = () => open.result.createObjectStore('worlds');
          open.onerror = () => { throw open.error; };
          open.onsuccess = () => {
            const db = open.result;
            if (localStorage.getItem('world') === 'seed') {
              const read = db.transaction('worlds').objectStore('worlds').get('seed');
              read.onsuccess = () => {
                if (!(read.result instanceof Float32Array) || read.result[0] !== 2.5) throw Error('Incorrect persisted world');
                document.title = 'Storage restored';
              };
              read.onerror = () => { throw read.error; };
              return;
            }
            const tx = db.transaction('worlds', 'readwrite');
            tx.objectStore('worlds').put(new Float32Array([2.5]), 'seed');
            tx.oncomplete = () => { localStorage.setItem('world', 'seed'); document.title = 'Storage written'; };
            tx.onabort = () => { throw tx.error; };
          };
          </script>
          '@ | Set-Content build/storage-smoke/index.html -Encoding utf8
          foreach ($status in 'Storage written','Storage restored') {
            $out = & .\build\Release\WebappSmokeV8.exe build/storage-smoke 1
            $code = $LASTEXITCODE
            $out | Write-Host
            if ($code -ne 0 -or !($out -match "title: $status")) { throw "$status check failed" }
          }
      - name: Verify scroll and selection in the Windows webapp runtime
        shell: pwsh
        run: |
          Copy-Item test/fixtures/webapp-menu build/menu-smoke -Recurse
          $script = @'
          <script type="module">
          import * as THREE from 'three';
          const renderer = new THREE.WebGLRenderer();
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
          camera.position.z = 5;
          scene.add(new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial()));
          renderer.setAnimationLoop(() => renderer.render(scene, camera));
          requestAnimationFrame(() => {
            const host = globalThis.__ntHost;
            const controls = document.getElementById('controls');
            const select = document.getElementById('quality');
            const b = select.getBoundingClientRect();
            const x = b.x + b.width / 2, y = b.y + b.height / 2;
            host.pointer('down', x, y, 0);
            host.pointer('up', x, y, 0);
            if (select.value !== 'low') throw Error('Opening select changed the value');
            host.key(true, 'ArrowDown', 'ArrowDown', false, false, false, false, false);
            host.key(true, 'Enter', 'Enter', false, false, false, false, false);
            if (select.value !== 'high') throw Error('Unable to select the enabled option');
            const r = controls.getBoundingClientRect();
            host.wheel(r.x + r.width / 2, r.y + 12, 0, 2400);
            host.ui.hitTest(r.x + r.width / 2, r.y + 12);
            const last = document.getElementById('last');
            const z = last.getBoundingClientRect();
            if (host.ui.hitTest(z.x + z.width / 2, z.y + z.height / 2) !== last) throw Error('Bottom control cannot be reached');
            controls.scrollTop = 0;
            host.ui.hitTest(r.x + r.width / 2, r.y + 12);
            const wrapper = document.createElement('div');
            wrapper.style.height = '10px';
            wrapper.style.overflow = 'visible';
            last.before(wrapper);
            wrapper.append(last);
            last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            const visible = last.getBoundingClientRect();
            if (host.ui.hitTest(visible.x + visible.width / 2, visible.y + visible.height / 2) !== last) throw Error('scrollIntoView did not reveal the bottom setting');
            document.title = 'Menu verified';
          });
          </script>
          '@
          $menu = Get-Content build/menu-smoke/index.html -Raw
          $menu.Replace('</body>', ($script + '</body>')) | Set-Content build/menu-smoke/index.html -Encoding utf8
          $out = & .\build\Release\WebappSmokeV8.exe build/menu-smoke 1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0 -or !($out -match 'title: Menu verified')) { throw "Menu interaction check failed" }
      - name: Real game check - Kuningriigid through the embedded webapp runtime (informational)
        continue-on-error: true
        shell: pwsh
        env:
          CI: '1'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --depth 1 https://github.com/orogdor/Kuningriigid.git kuningriigid-check
          if ($LASTEXITCODE -ne 0) { throw "Kuningriigid checkout failed" }
          & .\build\Release\WebappSmokeV8.exe kuningriigid-check 1
          if ($LASTEXITCODE -ne 0) { throw "Kuningriigid did not run cleanly on V8 (exit $LASTEXITCODE)" }
      - name: K73 compatibility smoke - real WebGL2 game loads until the known graphics blocker
        shell: pwsh
        env:
          CI: '1'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --depth 1 https://github.com/orogdor/game.git k73-compat-check
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out K73" }
          & .\build\Release\WebappSmokeV8.exe k73-compat-check 0 expect-webgl2-blocker
          if ($LASTEXITCODE -ne 0) { throw "K73 failed before reaching its expected WebGL2 blocker" }
      - name: Set up .NET 8 for the updaters
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Game1/Game2 launchers, updaters and package the two-game layout
        shell: pwsh
        env:
          CI: '1'
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          New-Item -ItemType Directory -Force dist, dist/game1/audio, dist/game2, dist/webapps/hello-webapp, release | Out-Null
          # Shared engine (forest battle + webapp mode, V8 for webapps)
          Copy-Item build/Release/NativeThree-Diagnostics.exe dist/NativeThree-Engine.exe
          Copy-Item third_party/v8pkg/v8.redist-v143-x64.13.0.245.25/lib/Release/* dist/
          # game1: forest battle test (scene.js); game2: empty until UpdateKuningriigid.exe
          Copy-Item game/scene.js dist/game1/scene.js
          Copy-Item game/ui.html dist/game1/ui.html
          Copy-Item game/ui.css dist/game1/ui.css
          Copy-Item game/audio/*.wav dist/game1/audio/
          Copy-Item generated/soldier-rigged.glb dist/game1/odamees-rigged.glb
          Copy-Item samples/hello-webapp/* dist/webapps/hello-webapp/
          Copy-Item samples/Run-Hello-Webapp.bat dist/Run-Hello-Webapp.bat
          foreach ($n in 1, 2) {
            cl /nologo /O2 /W3 /utf-8 /DNTB_GAME=$n launcher/Game-Launcher.c /Fe:dist/Game$n.exe /link /SUBSYSTEM:WINDOWS user32.lib
            if ($LASTEXITCODE -ne 0) { throw "Game$n launcher failed to compile" }
          }
          Remove-Item dist/*.obj -ErrorAction SilentlyContinue
          Remove-Item *.obj -ErrorAction SilentlyContinue
          foreach ($u in 'UpdateEngine', 'UpdateKuningriigid') {
            dotnet publish launcher/$u.csproj -c Release -o build/$u
            if ($LASTEXITCODE -ne 0) { throw "$u failed to build" }
            Copy-Item build/$u/$u.exe dist/$u.exe
            $p = Start-Process -FilePath (Resolve-Path dist/$u.exe) -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
            if ($p.ExitCode -ne 0) { throw "$u self-test failed" }
          }
          # Game2 with an empty game2 folder must stop with a message, not start the engine.
          $g2 = Start-Process -FilePath (Resolve-Path dist/Game2.exe) -Wait -PassThru
          if ($g2.ExitCode -ne 42) { throw "Game2.exe did not detect the empty game2 folder (exit $($g2.ExitCode))" }
          Set-Content dist/engine-version.txt -Value "v$v" -Encoding ascii -NoNewline
          Copy-Item README-WINDOWS.txt dist/README-WINDOWS.txt
          Copy-Item third_party/quickjs/LICENSE dist/LICENSE-QuickJS.txt
          Copy-Item node_modules/three/LICENSE dist/LICENSE-ThreeJS.txt
          # Engine-only package for UpdateEngine.exe (never contains game folders or updaters)
          New-Item -ItemType Directory -Force engine-package | Out-Null
          Get-ChildItem dist -File | Where-Object { $_.Name -notin @('UpdateEngine.exe','UpdateKuningriigid.exe','engine-version.txt','Run-Hello-Webapp.bat') } | Copy-Item -Destination engine-package
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path engine-package), (Join-Path (Get-Location) 'release/NativeThreeBridge-Engine-x64.zip'))
          $engineZip = Get-Item release/NativeThreeBridge-Engine-x64.zip
          $engineHash = (Get-FileHash $engineZip -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ tag = "v$v"; package = 'NativeThreeBridge-Engine-x64.zip'; sha256 = $engineHash; size = $engineZip.Length } | ConvertTo-Json -Compress | Set-Content release/engine-update-v2.json -Encoding utf8
          # Full download (ZipFile keeps the empty game2 folder)
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path dist), (Join-Path (Get-Location) 'release/NativeThreeBridge-Windows-x64.zip'))
          Copy-Item dist/UpdateEngine.exe, dist/UpdateKuningriigid.exe release/
          New-Item -ItemType Directory -Force verify | Out-Null
          Expand-Archive release/NativeThreeBridge-Windows-x64.zip -DestinationPath verify -Force
          foreach ($f in 'Game1.exe','Game2.exe','NativeThree-Engine.exe','UpdateEngine.exe','UpdateKuningriigid.exe','engine-version.txt','v8.dll','v8_libplatform.dll','game1/scene.js','game1/ui.css','game1/ui.html','game1/odamees-rigged.glb','game1/audio/signal.wav','game1/audio/step.wav','game1/audio/restart.wav','game1/audio/swing.wav','game1/audio/hit.wav','game1/audio/death.wav','webapps/hello-webapp/index.html','Run-Hello-Webapp.bat') {
            if (!(Test-Path "verify/$f")) { throw "Incomplete ZIP structure: $f" }
          }
          if (!(Test-Path verify/game2 -PathType Container)) { throw "Empty game2 folder missing from ZIP" }
          if ((Get-ChildItem verify/game2 -Force | Measure-Object).Count -ne 0) { throw "game2 must be empty in the ZIP" }
          Get-ChildItem release | Format-Table Name, Length
          Write-Host "Two-game package verified: v$v"
      - name: Verify in-window webapp reload on DX12
        shell: pwsh
        env:
          CI: '1'
        run: |
          $engine = (Resolve-Path dist/NativeThree-Engine.exe).Path
          $folder = (Resolve-Path test/fixtures/webapp-reload).Path
          $p = Start-Process -FilePath $engine -ArgumentList '--webapp', $folder -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(25)
            do {
              Start-Sleep -Milliseconds 250
              $p.Refresh()
            } until ($p.HasExited -or $p.MainWindowTitle -like 'New world active*' -or (Get-Date) -ge $deadline)
            if ($p.HasExited -or $p.MainWindowTitle -notlike 'New world active*1 draws*') {
              Get-Content dist/NativeThreeBridge-webapp-log.txt
              throw "The new world did not render in the same window"
            }
            $log = Get-Content dist/NativeThreeBridge-webapp-log.txt -Raw
            if ([regex]::Matches($log, 'Reloading the webapp').Count -ne 2 -or $log -match '\[error\]') {
              Write-Host $log
              throw "Webapp replace/reload failed"
            }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            $p.WaitForExit()
          }
      - name: Screenshot the HTML/CSS UI drawn by the engine (fixture and Kuningriigid)
        continue-on-error: true
        shell: pwsh
        env:
          CI: '1'
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WebappShotInput {
            [DllImport("user32.dll")]
            public static extern bool PostMessage(IntPtr hwnd, uint message, IntPtr wParam, IntPtr lParam);
          }
          '@
          function Save-Screen($file) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($file)
            $g.Dispose(); $bmp.Dispose()
          }
          # Also printed into the log (base64 JPEG between BEGIN-SHOT/END-SHOT) for tools without artifact access.
          function Print-Shot($file, $name) {
            $img = [System.Drawing.Image]::FromFile($file)
            $ms = New-Object System.IO.MemoryStream
            $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
            $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
            $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 88L
            $img.Save($ms, $codec, $ep)
            $img.Dispose()
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            Write-Host "BEGIN-SHOT $name"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("SHOT " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "END-SHOT $name"
          }
          New-Item -ItemType Directory -Force shots | Out-Null
          $engine = (Resolve-Path dist/NativeThree-Engine.exe).Path
          $runs = @(@{ name = 'ui-fixture'; dir = 'test/fixtures/webapp-ui'; wait = 12 }, @{ name = 'textures-fixture'; dir = 'test/fixtures/webapp-textures'; wait = 12 })
          if (Test-Path kuningriigid-check/index.html) { $runs += @{ name = 'kuningriigid'; dir = 'kuningriigid-check'; wait = 40 } }
          foreach ($r in $runs) {
            $folder = (Resolve-Path $r.dir).Path
            $p = Start-Process -FilePath $engine -ArgumentList '--webapp', $folder -WorkingDirectory (Resolve-Path dist).Path -PassThru
            Start-Sleep -Seconds $r.wait
            if ($r.name -eq 'kuningriigid' -and !$p.HasExited) {
              $p.Refresh()
              if ($p.MainWindowHandle -ne 0) {
                # Continue Game in the native main menu on the standard runner window.
                $at = [IntPtr]((175 -shl 16) -bor 752)
                [void][WebappShotInput]::PostMessage($p.MainWindowHandle, 0x201, [IntPtr]1, $at)
                Start-Sleep -Milliseconds 100
                [void][WebappShotInput]::PostMessage($p.MainWindowHandle, 0x202, [IntPtr]::Zero, $at)
                Start-Sleep -Seconds 12
              }
            }
            Save-Screen (Join-Path (Get-Location) "shots/$($r.name).png")
            Print-Shot (Join-Path (Get-Location) "shots/$($r.name).png") $r.name
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 1
            if (Test-Path dist/NativeThreeBridge-webapp-log.txt) {
              Copy-Item dist/NativeThreeBridge-webapp-log.txt "shots/$($r.name)-log.txt"
              Write-Host "---- $($r.name) log ----"
              Get-Content dist/NativeThreeBridge-webapp-log.txt | Select-String -Pattern 'UI layer|frame \d+:|\[error\]|crash|Texture|Canvas|shader' | Select-Object -First 40
            }
          }
      - name: Verify translated material on DX12
        shell: pwsh
        run: |
          $log = Get-Content shots/textures-fixture-log.txt -Raw -ErrorAction Stop
          if ($log -notmatch '\[material-color\] compiled GLSL color stage' -or $log -match '\[material-color\] (shader patch skipped|pipeline could not)') {
            throw "The GLSL color stage did not run on DX12"
          }
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/
          if-no-files-found: ignore
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: NativeThreeBridge-Windows-x64
          path: |
            release/NativeThreeBridge-Windows-x64.zip
            release/NativeThreeBridge-Engine-x64.zip
            release/engine-update-v2.json
      - name: Publish isolated UI/3D cadence experiment (never replace stable updater release)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'experiments/2d3d-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $tag = "v$v-ui-cadence-test"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Could not replace previous UI cadence test release" }
          }
          gh release create $tag release/NativeThreeBridge-Windows-x64.zip release/NativeThreeBridge-Engine-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:HEAD_SHA --prerelease --title "NativeThreeBridge $tag – isolated UI/3D cadence experiment" --notes "Experimental build from PR #$env:PR_NUMBER ($env:HEAD_SHA). Run in a SEPARATE test folder. 3D game frames are unrestricted; 2D CSS/UI refresh defaults to 30 Hz using cached pixels. Set NATIVE_THREE_UI_HZ=0 to use original every-frame UI as an A/B baseline. This is a staged cadence split, NOT a threaded implementation. Do not run UpdateEngine.exe from the test copy: stable updates deliberately ignore this prerelease. Unmodified v0.32.15 source preserved in backup/pre-2d3d-split-v03215-20261110."
