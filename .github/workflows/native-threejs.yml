name: Build native Three.js Windows Game and separate Updater
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build official Three.js core separately from game/scene.js
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12
          if ($LASTEXITCODE -ne 0) { throw "esbuild install failed" }
          New-Item -ItemType Directory -Force generated,third_party | Out-Null
          npx esbuild threejs-native/three-runtime-entry.mjs --bundle --platform=neutral --format=iife --target=es2020 --outfile=generated/three-runtime.bundle.js
          if ($LASTEXITCODE -ne 0) { throw "Three.js runtime bundle failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "JavaScript tests failed" }
      - name: Convert original Kuningriigid spearman and pine GLBs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw "Pillow install failed" }
          python tools/test_spearman_rig.py
          if ($LASTEXITCODE -ne 0) { throw "Eight-bone GLB skin unit tests failed" }
          python tools/pack_kuningriigid.py
          if ($LASTEXITCODE -ne 0) { throw "GLB conversion failed" }
          if (!(Test-Path generated/soldier-rigged.glb) -or !(Test-Path generated/skin0.bin)) { throw "Skeleton asset packing failed" }
      - name: Generate editable native PCM16 audio test samples
        shell: pwsh
        run: |
          python tools/generate_native_audio_samples.py
          if ($LASTEXITCODE -ne 0) { throw "Native audio WAV generation failed" }
          foreach ($name in @('signal','step','restart','swing','hit','death')) {
            if (!(Test-Path "game/audio/$name.wav")) { throw "Missing $name WAV" }
          }
      - name: Acquire pinned QuickJS-NG native JavaScript engine
        shell: pwsh
        run: |
          git clone --branch v0.13.0 --depth 1 https://github.com/quickjs-ng/quickjs.git third_party/quickjs
          if ($LASTEXITCODE -ne 0) { throw "QuickJS-NG checkout failed" }
      - name: Compile native game engine and runtime smoke test
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build --config Release --target NativeCoreSmoke ThreeSceneSmoke NativeThreeJS --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native game EXE failed to compile" }
      - name: Verify generic scene registry, spatial index and async path worker pool
        shell: pwsh
        run: |
          & .\\build\\Release\\NativeCoreSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Native core subsystem tests failed" }
      - name: Compile HLSL main lighting and per-soldier shadow shaders without GPU
        shell: pwsh
        run: |
          cl /nologo /O2 /W3 /EHsc /std:c++17 tools/shader_smoke.cpp /Fe:build/shader_smoke.exe /link d3dcompiler.lib
          if ($LASTEXITCODE -ne 0) { throw "Shader compiler smoke executable failed to build" }
          & .\build\shader_smoke.exe native-dx12/NativeThree-DX12.cpp
          if ($LASTEXITCODE -ne 0) { throw "DX12 lighting/shadow HLSL failed to compile" }
      - name: Execute actual Three.js runtime smoke test in Windows
        shell: pwsh
        env:
          CI: '1'
        run: |
          if (!(Test-Path build/Release/game/scene.js)) { throw "External scene.js missing" }
          & .\build\Release\ThreeSceneSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Embedded Three.js JavaScript execution failed" }
      - name: Build separate update checker and package editable game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/game | Out-Null
          Copy-Item build/Release/NativeThree-Diagnostics.exe dist/NativeThree-Game.exe
          Copy-Item game/scene.js dist/game/scene.js
          Copy-Item game/ui.html dist/game/ui.html
          Copy-Item game/ui.css dist/game/ui.css
          New-Item -ItemType Directory -Force dist/game/audio | Out-Null
          Copy-Item game/audio/*.wav dist/game/audio/
          Copy-Item generated/soldier-rigged.glb dist/game/odamees-rigged.glb
          cl /nologo /O2 /W3 /TC launcher/NativeThree-Updater.c /Fe:dist/NativeThree-Updater.exe /link /SUBSYSTEM:WINDOWS kernel32.lib shell32.lib user32.lib winhttp.lib advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw "Separate updater EXE failed to compile" }
          & .\dist\NativeThree-Updater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Offline independent updater self-test failed" }
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          Set-Content dist/installed-version.txt -Value $v -Encoding ascii -NoNewline
          Copy-Item README-WINDOWS.txt dist/README-WINDOWS.txt
          Copy-Item third_party/quickjs/LICENSE dist/LICENSE-QuickJS.txt
          Copy-Item node_modules/three/LICENSE dist/LICENSE-ThreeJS.txt
          $gameHash=(Get-FileHash dist/NativeThree-Game.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sceneHash=(Get-FileHash dist/game/scene.js -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) "dist/update-v2.txt"), ("NTB2`n" + $v + "`n" + $gameHash + "`n" + $sceneHash + "`n"), [Text.Encoding]::ASCII)
          Compress-Archive -Path dist/* -DestinationPath NativeThreeBridge-Windows-x64.zip -Force
          Move-Item NativeThreeBridge-Windows-x64.zip dist/NativeThreeBridge-Windows-x64.zip -Force
          New-Item -ItemType Directory -Force verify | Out-Null
          Expand-Archive dist/NativeThreeBridge-Windows-x64.zip -DestinationPath verify -Force
          if (!(Test-Path verify/NativeThree-Updater.exe) -or !(Test-Path verify/NativeThree-Game.exe) -or !(Test-Path verify/game/scene.js) -or !(Test-Path verify/game/ui.css) -or !(Test-Path verify/game/ui.html) -or !(Test-Path verify/game/odamees-rigged.glb) -or !(Test-Path verify/game/audio/signal.wav) -or !(Test-Path verify/game/audio/step.wav) -or !(Test-Path verify/game/audio/restart.wav) -or !(Test-Path verify/game/audio/swing.wav) -or !(Test-Path verify/game/audio/hit.wav) -or !(Test-Path verify/game/audio/death.wav)) { throw "Incomplete ZIP structure" }
          Write-Host "Separate updater EXE + game EXE + editable Three.js scene verified: $v"
      - name: Upload independent Windows game and updater
        uses: actions/upload-artifact@v4
        with:
          name: NativeThreeBridge-Windows-x64
          path: |
            dist/NativeThreeBridge-Windows-x64.zip
            dist/update-v2.txt
      - name: Publish stable release (only after Windows tests succeed)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $tag="v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; it is NOT overwritten"
          } else {
            gh release create $tag dist/NativeThreeBridge-Windows-x64.zip dist/NativeThree-Game.exe dist/NativeThree-Updater.exe dist/game/scene.js dist/game/ui.css dist/game/ui.html dist/game/audio/signal.wav dist/game/audio/step.wav dist/game/audio/restart.wav dist/game/audio/swing.wav dist/game/audio/hit.wav dist/game/audio/death.wav dist/game/odamees-rigged.glb dist/update-v2.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "NativeThreeBridge $tag – separate updater + native Three.js game" --notes "v0.26.0: Close-up soldier jitter fix. 60 Hz simulation now interpolates entire 3D object transforms (XYZ and rotation, yaw fast-path plus generic 3D quaternion fallback) for displays running at 100-170+ FPS. The F2/F3 follow camera reads exactly the same interpolated pose instead of jumping to the last simulation tick. Attack, hit and death animation samples now interpolate between fixed steps; A* waypoint facing turns smoothly instead of snapping 90 degrees. F12 quick battle refreshes real Three.js instance transforms immediately to avoid one stale first frame. No changes to collision, route reservations, 10,000 trees, lighting, native XAudio2, CSS Restart, 5/3/1 combat health or win/return logic. Adds portable numeric angle-wrap/affine tests and end-to-end source-level motion regression. Use F2/F3 and mouse wheel to examine smooth animation; old v0.25.0 remains available for A/B comparison."
            if ($LASTEXITCODE -ne 0) { throw "GitHub release failed" }
          }
